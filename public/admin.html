<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NAP Platform Core :: Intelligent Procurement Console</title>
    <style>
        :root {
            --bg-color: #0c0f1d;
            --card-bg: #151a30;
            --accent-purple: #6366f1;
            --accent-hover: #4f46e5;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --border-color: #2e3757;
            --code-bg: #090d16;
            --green-active: #10b981;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 2rem;
        }

        .header {
            margin-bottom: 2rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 1rem;
        }

        .header h1 {
            font-size: 1.5rem;
            margin: 0 0 0.5rem 0;
            color: #818cf8;
        }

        .header p {
            margin: 0;
            color: var(--text-muted);
            font-size: 0.875rem;
        }

        .grid {
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 1.5rem;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 1.5rem;
        }

        .badge {
            display: inline-block;
            background-color: rgba(16, 185, 129, 0.1);
            color: var(--green-active);
            border: 1px solid rgba(16, 185, 129, 0.3);
            font-size: 0.7rem;
            font-weight: bold;
            padding: 2px 6px;
            border-radius: 4px;
            margin-top: 4px;
        }

        .form-group {
            margin-bottom: 1.2rem;
        }

        .form-group label {
            display: block;
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 0.4rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .form-group input {
            width: 100%;
            padding: 0.6rem 0.8rem;
            background-color: var(--code-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-main);
            font-size: 0.9rem;
            box-sizing: border-box;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--accent-purple);
        }

        .btn {
            width: 100%;
            padding: 0.8rem;
            background-color: var(--accent-purple);
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.9rem;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn:hover {
            background-color: var(--accent-hover);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .response-container pre {
            background-color: var(--code-bg);
            border: 1px solid var(--border-color);
            padding: 1rem;
            border-radius: 6px;
            color: #38bdf8;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.85rem;
            overflow-x: auto;
            white-space: pre-wrap;
            margin: 0;
        }

        .response-title {
            font-size: 1rem;
            margin-top: 0;
            margin-bottom: 1rem;
            color: var(--text-main);
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>NAP Platform Core :: Intelligent Procurement Console</h1>
        <p>Powered by PHP 8.3 CLI | Multi-Agent LLM Engine | Event-Sourced Architecture</p>
    </div>

    <div class="grid">
        <!-- Input Form -->
        <div class="card">
            <h3 style="margin-top:0; font-size: 1rem;">Submit Purchase Order Evaluation</h3>
            <div class="badge">GEMINI ACTIVE</div>
            
            <form id="evaluationForm" style="margin-top: 1.5rem;">
                <div class="form-group">
                    <label for="partNumberInput">Part Number / Item</label>
                    <input type="text" id="partNumberInput" value="NAP-SERIES-900" required>
                </div>

                <div class="form-group">
                    <label for="baseAmountInput">Base Amount (ZAR)</label>
                    <input type="number" id="baseAmountInput" value="85000" required>
                </div>

                <div class="form-group">
                    <label for="supplierIdInput">Target Supplier ID</label>
                    <input type="text" id="supplierIdInput" value="SUPPLIER-001" required>
                </div>

                <button type="submit" id="submitBtn" class="btn">Evaluate via Gemini AI Agent</button>
            </form>
        </div>

        <!-- Telemetry Output -->
        <div class="card response-container">
            <h3 class="response-title">AI Recommendation &amp; Telemetry</h3>
            <pre id="telemetryOutput">// Ready for telemetry evaluation...</pre>
        </div>
    </div>

    <script>
        document.getElementById('evaluationForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const submitBtn = document.getElementById('submitBtn');
            const outputBlock = document.getElementById('telemetryOutput');

            // Read typed values directly from DOM elements
            const partNumber = document.getElementById('partNumberInput').value.trim();
            const normalizedAmount = parseFloat(document.getElementById('baseAmountInput').value) || 85000;
            const supplierId = document.getElementById('supplierIdInput').value.trim();

            submitBtn.disabled = true;
            submitBtn.innerText = 'Evaluating...';
            outputBlock.innerText = '// Sending evaluation request to Gemini Agent...';

            try {
                const response = await fetch('/api/evaluate', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        partNumber: partNumber,
                        normalizedAmount: normalizedAmount,
                        supplierId: supplierId
                    })
                });

                const data = await response.json();
                outputBlock.innerText = JSON.stringify(data, null, 2);
            } catch (err) {
                outputBlock.innerText = JSON.stringify({
                    status: 'error',
                    message: 'Failed to connect to endpoint: ' + err.message
                }, null, 2);
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = 'Evaluate via Gemini AI Agent';
            }
        });
    </script>
</body>
</html>
