<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NAP Platform - Automotive OEM Cross-Reference Intelligence</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
        .card { background-color: #1e293b; border: 1px solid #334155; color: #f8fafc; }
        .badge-brand { background-color: #3b82f6; color: white; font-weight: 600; }
        .badge-price { background-color: #10b981; color: white; font-weight: bold; }
        .table-custom { color: #e2e8f0; }
        .table-custom th { background-color: #0f172a; color: #94a3b8; border-color: #334155; }
        .table-custom td { border-color: #334155; vertical-align: middle; }
    </style>
</head>
<body class="py-5">
    <div class="container">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h2 class="fw-bold mb-0">?? NAP Automotive Cross-Reference Agent</h2>
                <p class="text-secondary mb-0">Real-time background harvester indexing OEM & aftermarket alternatives</p>
            </div>
            <a href="/api/v1/agent/status" target="_blank" class="btn btn-outline-info btn-sm">?? View Worker Status</a>
        </div>

        <div class="card p-4 mb-4 shadow-lg">
            <h5 class="fw-bold mb-3">?? Search Part Cross-References</h5>
            <form id="searchForm" class="row g-3">
                <div class="col-md-9">
                    <input type="text" id="oemInput" class="form-control form-control-lg bg-dark text-light border-secondary" placeholder="Enter OEM Part Number (e.g. A2058800100, 34116858652)" value="A2058800100" required>
                </div>
                <div class="col-md-3">
                    <button type="submit" class="btn btn-primary btn-lg w-100 fw-bold">Find Alternatives</button>
                </div>
            </form>
        </div>

        <div id="resultsCard" class="card p-4 shadow-lg d-none">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h5 class="fw-bold mb-0">Results for OEM: <span id="oemLabel" class="text-info"></span></h5>
                <span id="matchBadge" class="badge bg-success fs-6"></span>
            </div>
            <div class="table-responsive">
                <table class="table table-custom mb-0">
                    <thead>
                        <tr>
                            <th>Supplier Part #</th>
                            <th>Brand</th>
                            <th>Quoted Price (ZAR)</th>
                            <th>Scrape Hits</th>
                            <th>Last Verified</th>
                        </tr>
                    </thead>
                    <tbody id="resultsTable"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('searchForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const oem = document.getElementById('oemInput').value.trim();
            if (!oem) return;

            const res = await fetch(`/api/v1/parts/cross-reference?oem=${encodeURIComponent(oem)}`);
            const json = await res.json();

            document.getElementById('oemLabel').textContent = json.data.oemPartNumber;
            document.getElementById('matchBadge').textContent = `${json.data.matchesCount} Alternatives Found`;

            const tbody = document.getElementById('resultsTable');
            tbody.innerHTML = '';

            json.data.alternatives.forEach(item => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><code>${item.supplierPartNumber}</code></td>
                    <td><span class="badge badge-brand">${item.brandName}</span></td>
                    <td><span class="badge badge-price">R ${parseFloat(item.lastQuotedPrice).toFixed(2)}</span></td>
                    <td>${item.occurrenceCount} passes</td>
                    <td class="text-secondary small">${new Date(item.updatedAt).toLocaleString()}</td>
                `;
                tbody.appendChild(tr);
            });

            document.getElementById('resultsCard').classList.remove('d-none');
        });

        // Auto-search default part on load
        window.addEventListener('DOMContentLoaded', () => {
            document.getElementById('searchForm').dispatchEvent(new Event('submit'));
        });
    </script>
</body>
</html>
