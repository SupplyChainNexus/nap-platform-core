version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nap-platform-core
    ports:
      - "8080:80"
    volumes:
      - ./database.sqlite:/var/www/html/database.sqlite
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
    healthcheck:
      test: ["CMD", "php", "bin/nap", "help"]
      interval: 10s
      timeout: 5s
      retries: 3